[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskflow-engine"
version = "0.1.0"
description = "A modular local-first Python task automation engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Godfrey Junior Maliki"}
]
dependencies = []

[project.scripts]
taskflow = "taskflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
